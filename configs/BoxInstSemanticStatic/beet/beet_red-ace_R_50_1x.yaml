_BASE_: "../Base-BoxInstSemanticStatic.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  RESNETS:
    DEPTH: 50
  FCOS:
    NUM_CLASSES: 2
DATASETS:
  TRAIN: ("beet_red-ace_train",)
  TEST: ("beet_red-ace_val",)
