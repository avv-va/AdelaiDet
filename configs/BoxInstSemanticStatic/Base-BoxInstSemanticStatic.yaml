MODEL:
  META_ARCHITECTURE: "BoxInstSemanticStatic"
  MASK_ON: True
  BACKBONE:
    NAME: "build_fcos_resnet_fpn_backbone"
  RESNETS:
    OUT_FEATURES: ["res3", "res4", "res5"]
  FPN:
    IN_FEATURES: ["res3", "res4", "res5"]
  PROPOSAL_GENERATOR:
    NAME: "FCOS"
  FCOS:
    THRESH_WITH_CTR: True
    USE_SCALE: True
    # Semantic aggregation needs exhaustive per-class instance recall, not a
    # manageable top-100 detection list -- raise the NMS/topk caps relative
    # to the BoxInst instance-segmentation defaults.
    PRE_NMS_TOPK_TEST: 3000
    POST_NMS_TOPK_TEST: 500
    INFERENCE_TH_TEST: 0.03
  CONDINST:
    MASK_BRANCH:
      OUT_CHANNELS: 16
  BOXINST:
    ENABLED: True
    BOTTOM_PIXELS_REMOVED: 10
    PAIRWISE:
      SIZE: 3
      DILATION: 2
      COLOR_THRESH: 0.3
DATASETS:
  TRAIN: ("coco_2017_train",)
  TEST: ("coco_2017_val",)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.01
  STEPS: (60000, 80000)
  MAX_ITER: 90000
INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
