_BASE_: "Base-BoxInstSemanticStatic.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  RESNETS:
    DEPTH: 50
  FCOS:
    NUM_CLASSES: 2
DATASETS:
  TRAIN: ("VOC_2_verdant_1img_train",)
  TEST: ("VOC_2_verdant_1img_val",)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.01
  MAX_ITER: 20000
  STEPS: (44800, 57600)
  CHECKPOINT_PERIOD: 500
TEST:
  EVAL_PERIOD: 500
OUTPUT_DIR: "output/boxinst_semantic_static_voc_2_1img_r50_1x"
