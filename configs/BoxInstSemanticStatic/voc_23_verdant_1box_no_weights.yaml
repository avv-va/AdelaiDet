_BASE_: "Base-BoxInstSemanticStatic.yaml"
MODEL:
  RESNETS:
    DEPTH: 50
  FCOS:
    NUM_CLASSES: 2
DATASETS:
  TRAIN: ("voc23_verdant_1box_train",)
  TEST: ("voc23_verdant_1box_val",)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.01
  MAX_ITER: 20000
  STEPS: (44800, 57600)
  CHECKPOINT_PERIOD: 500
TEST:
  EVAL_PERIOD: 500
OUTPUT_DIR: "output/boxinst_semantic_static_voc_no_weights"
