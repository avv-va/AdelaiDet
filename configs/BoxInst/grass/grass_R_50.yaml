_BASE_: "../Base-BoxInst.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  RESNETS:
    DEPTH: 50
  FCOS:
    NUM_CLASSES: 2
DATASETS:
  TRAIN: ("grass_train",)
  TEST: ("grass_val",)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.01
  MAX_ITER: 20000
  STEPS: (14000, 18000)
  CHECKPOINT_PERIOD: 500
TEST:
  EVAL_PERIOD: 2000
OUTPUT_DIR: "output/boxinst_grass_R_50"
