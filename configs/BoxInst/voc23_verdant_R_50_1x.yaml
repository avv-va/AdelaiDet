_BASE_: "Base-BoxInst.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  RESNETS:
    DEPTH: 50
  FCOS:
    NUM_CLASSES: 2          # bird, boat (default is 80 for COCO)
DATASETS:
  TRAIN: ("voc23_verdant_train",)
  TEST: ("voc23_verdant_val",)
SOLVER:
  # 260 train imgs / IMS_PER_BATCH 16 ~= 16 iters/epoch. 4800 iters ~= 300
  # epochs. Steps at 0.7/0.9 of MAX_ITER (same ratio as phenobench).
  IMS_PER_BATCH: 16
  BASE_LR: 0.01
  MAX_ITER: 4800
  STEPS: (3360, 4320)
TEST:
  EVAL_PERIOD: 1000
OUTPUT_DIR: "output/boxinst_voc23_verdant_r50_1x"
